spring:
  application:
    name: campusconnect
  autoconfigure:
    exclude:
      # we use JWT, not Spring's default in-memory user (it prints a random password at startup)
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus@123}
    hikari:
      maximum-pool-size: 10          # Phase B/D: ~6 in-flight expected, 10 is enough
      connection-timeout: 3000       # fail fast (3 s) instead of hanging

  jpa:
    open-in-view: false              # Phase D, decision D3
    hibernate:
      ddl-auto: validate             # Phase D, D4: Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
server:
  forward-headers-strategy: native   # real client IP behind Nginx (see note below)

app:
  auth:
    allowed-email-domains:
      - college.edu
    require-email-verification: true       # was false in Part 1
    refresh-token-days: 14
    refresh-reuse-grace-seconds: 10
    email-verification-hours: 24
    cookie-secure: false                   # PROD: true (needs HTTPS)
    frontend-base-url: http://localhost:5173
  mail:
    mode: log                              # DEV ONLY: emails are printed, not sent
  rate-limit:                              # ASSUMPTIONS, tune with real traffic (Phase J)
    register-per-ip: 20                    # per hour
    login-per-ip: 60                       # per minute
    login-failures-per-email: 10           # per 15 minutes
    resend-per-ip: 10                      # per hour
    resend-per-email: 3                    # per hour
    refresh-per-ip: 60                     # per minute
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-1234}   # prod: env var, min 32 bytes
    access-token-minutes: 15
    issuer: campusconnect
  storage:
    public-base-url: ""      # filled in the storage branch; empty means avatarUrl = null